name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slides:
    name: slides (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm slides:build

  report:
    name: report (latex)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b  # 4.1.0
        with:
          root_file: main.tex
          working_directory: report

  pycode:
    name: code (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the RDD tool + benchmarks (editable)
        run: python -m pip install -e code/
      - name: Tool invariants
        run: PYTHONHASHSEED=0 python -m rdd.tests.test_rdd
      - name: Benchmark suite self-test (binary-dependent tests skip without upstream/)
        run: PYTHONHASHSEED=0 python -m benchmarks.tests.test_benchmarks
      - name: Reproducibility gate — the real anchor + the B2 sweep reproduce the committed references (model-free, ~3 min)
        # `run coherence` is the unified model-free gate (real anchor + B2 exact). B1 + B3 are binary-gated -> the
        # self-test above reproduces them only where the native_sim binaries are built (absent in CI -> they SKIP).
        run: PYTHONHASHSEED=0 python -m benchmarks.run coherence

  ci-ok:
    name: CI green
    if: always()
    needs: [slides, report, pycode]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
