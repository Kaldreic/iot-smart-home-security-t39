packages:
  - "presentation"
allowBuilds:
  esbuild: true
  playwright-chromium: true
# Resolve every dependency to the newest version its range allows (pnpm's
# time-based mode would otherwise keep transitive packages on old, advisory-bearing
# releases). The lockfile is what pins the tree; the audit is re-run against it.
resolutionMode: highest
# Security pins (overrides live here, not in package.json#pnpm: pnpm 10 deprecates
# that location and pnpm 11 ignores it). monaco-editor pins dompurify exactly, so
# lift it onto the patched 3.4.x line that mermaid 12 already requires.
overrides:
  dompurify: "^3.4.16"
  # chevrotain (a mermaid dependency) pins lodash-es 4.17.x exactly; lift it onto the patched line.
  lodash-es: "^4.18.1"
# Known, accepted: image-size 1.x via pptxgenjs (Slidev's PPTX export, unused here) has no
# patched 1.x release and forcing 2.x would change the API pptxgenjs calls.
