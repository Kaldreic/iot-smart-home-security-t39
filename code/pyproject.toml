[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rdd"
version = "1.0.1"
description = "Robust Delta-Debugging: a noise-robust bug-reproduction minimiser for wireless IoT fuzzing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"                # code/LICENSE is a copy of the root LICENSE: setuptools reads it from here
authors = [
  { name = "Aldo Ristori" },
  { name = "Nicole Sperandini" },
]
# numpy (the suite) + drain3 (the tool). The live L3 judge talks to an OPTIONAL local
# Ollama server over stdlib urllib — not a dependency; the committed verdict cache
# reproduces every benchmark without it.
dependencies = [
  "numpy>=1.24",
  "drain3>=0.9",
]

[project.urls]
Repository = "https://github.com/Kaldreic/iot-smart-home-security-t39"
Report = "https://github.com/Kaldreic/iot-smart-home-security-t39/tree/main/report"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]   # pyflakes plus the pycodestyle errors
ignore = ["E731"]                     # small lambdas are used on purpose

[tool.setuptools.packages.find]
where = ["src"]
include = ["rdd*", "emulation*", "benchmarks*"]   # tests ship too: the README runs them from an install

# The committed reference data and crash dumps ship with the wheel.
[tool.setuptools.package-data]
emulation = ["data/**/*.json", "data/**/*.txt"]
benchmarks = ["data/**/*.json"]
